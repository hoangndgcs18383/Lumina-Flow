name: Lumina 7-day agent
on:
  schedule:
    - cron: '17 2 * * *' # 09:17 Asia/Bangkok; GitHub may start later.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumina-maintenance
  cancel-in-progress: false
env:
  LUMINA_AGENT_ENABLED: ${{ vars.LUMINA_AGENT_ENABLED }}
  LUMINA_AGENT_START_DATE: ${{ vars.LUMINA_AGENT_START_DATE }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.window.outputs.enabled }}
      day: ${{ steps.window.outputs.day }}
      date: ${{ steps.window.outputs.date }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: window
        run: python3 scripts/automation.py gate

  agent:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require API secret
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != 'true' ]; then
            echo 'Add OPENAI_API_KEY in repository Actions secrets before enabling the agent.' >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify
      - name: Prepare context and audit input
        run: |
          python3 scripts/automation.py gate
          npm audit --json > artifacts/dependency-audit.json || true
      - name: Make a focused maintenance change
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813 # Reviewed main snapshot
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.165.0'
          model: ${{ vars.LUMINA_AGENT_MODEL }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .github/prompts/maintenance.md
          output-file: artifacts/maintenance-report.md
      # No write-capable repository token or API secret is passed to these steps.
      # Work requiring privilege or repository writes runs on a new runner below.
      - name: Export bounded patch
        run: python3 scripts/automation.py export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-candidate
          path: |
            artifacts/maintenance.patch
            artifacts/maintenance-report.md
          retention-days: 14

  verify:
    needs: [gate, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintenance-candidate
          path: artifacts
      - id: apply
        run: |
          python3 scripts/automation.py apply
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/verify
        if: steps.apply.outputs.changed == 'true'

  publish:
    needs: [gate, verify]
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write # Dispatch CI on the bot branch; GITHUB_TOKEN pushes alone do not trigger it.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintenance-candidate
          path: artifacts
      - name: Validate and publish draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PILOT_DAY: ${{ needs.gate.outputs.day }}
          PILOT_DATE: ${{ needs.gate.outputs.date }}
        run: |
          python3 scripts/automation.py apply
          branch="agent/maintenance-$PILOT_DATE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m "Maintain Lumina Flow: day $PILOT_DAY ($PILOT_DATE)"
          gh auth setup-git
          git push origin "$branch"
          printf 'Daily maintenance, day %s.\n\nValidated on a fresh runner before publishing. Unity/device checks still require Unity.\n\n' "$PILOT_DAY" > "$RUNNER_TEMP/pr-body.md"
          if [ -f artifacts/maintenance-report.md ]; then
            cat artifacts/maintenance-report.md >> "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr create --draft --base "$BASE_BRANCH" --head "$branch" --title "Maintenance day $PILOT_DAY: $PILOT_DATE" --body-file "$RUNNER_TEMP/pr-body.md"
          gh workflow run ci.yml --ref "$branch"
